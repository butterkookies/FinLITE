<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .header-title { font-family: 'Inter', system-ui, sans-serif; font-size: 26px; font-weight: 800; fill: #0f172a; }
      .header-sub { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; fill: #64748b; font-weight: 500; }
      .stage-pill { font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700; fill: #047857; }
      .pill-bg { fill: #d1fae5; rx: 6px; }
      .card-bg { fill: #ffffff; rx: 14px; filter: drop-shadow(0 8px 20px rgba(15, 23, 42, 0.05)); }
      .th-text { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; font-weight: 700; fill: #ffffff; }
      .td-text { font-family: 'Inter', system-ui, sans-serif; font-size: 10px; fill: #334155; }
      .td-mono { font-family: 'JetBrains Mono', monospace; font-size: 9.5px; fill: #0f172a; font-weight: 600; }
      .grid-line { stroke: #f1f5f9; stroke-width: 1; }
      .callout-bg { fill: #ecfdf5; stroke: #a7f3d0; stroke-width: 1.5; rx: 12px; }
      .callout-title { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; font-weight: 800; fill: #065f46; }
      .callout-text { font-family: 'Inter', system-ui, sans-serif; font-size: 11px; fill: #047857; line-height: 1.45; }
      .badge-3nf { fill: #dcfce7; rx: 4px; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="680" class="bg" />

  <!-- Header Section -->
  <g transform="translate(60, 35)">
    <rect x="0" y="0" width="80" height="26" class="pill-bg" />
    <text x="40" y="17" text-anchor="middle" class="stage-pill">STEP 3</text>
    <text x="96" y="20" class="header-title">Third Normal Form (3NF) — Pure Non-Key Independence</text>
    <text x="0" y="44" class="header-sub">Eliminated all transitive dependencies ($X \rightarrow Y \rightarrow Z$). The complete 18-table relational architecture of FinLITE.</text>
  </g>

  <!-- Subsystem 1: Central Financial Ledger -->
  <g transform="translate(60, 95)">
    <rect width="345" height="235" class="card-bg" />
    <rect x="0" y="0" width="345" height="30" fill="#0f172a" rx="14" />
    <rect x="0" y="15" width="345" height="15" fill="#0f172a" />
    <text x="12" y="20" class="th-text">1. CENTRAL FINANCIAL LEDGER</text>

    <text x="12" y="46" class="td-mono" font-weight="700">transactions</text>
    <text x="12" y="60" class="td-text">id [PK], semester_id [FK], category_id [FK], amount, type, status, logged_by [FK], audited_by [FK]</text>
    <line x1="0" y1="68" x2="345" y2="68" stroke="#e2e8f0" />

    <text x="12" y="86" class="td-mono" font-weight="700">categories</text>
    <text x="12" y="100" class="td-text">id [PK], name, type ('INFLOW'/'OUTFLOW'), description</text>
    <line x1="0" y1="108" x2="345" y2="108" stroke="#e2e8f0" />

    <text x="12" y="126" class="td-mono" font-weight="700">transaction_receipts <tspan fill="#047857">(3NF Decomposed)</tspan></text>
    <text x="12" y="140" class="td-text">id [PK], transaction_id [FK], public_url, sort_order</text>
    <line x1="0" y1="148" x2="345" y2="148" stroke="#e2e8f0" />

    <text x="12" y="166" class="td-mono" font-weight="700">transaction_comments <tspan fill="#047857">(3NF Decomposed)</tspan></text>
    <text x="12" y="180" class="td-text">id [PK], transaction_id [FK], author_id [FK], comment_text</text>

    <rect x="0" y="196" width="345" height="39" fill="#f8fafc" rx="8" />
    <text x="12" y="218" font-family="'Inter', sans-serif" font-size="10.5px" fill="#475569">Audit comments never alter core financial figures.</text>
  </g>

  <!-- Subsystem 2: Cashbox Reconciliation & 11 Denominations -->
  <g transform="translate(425, 95)">
    <rect width="345" height="235" class="card-bg" />
    <rect x="0" y="0" width="345" height="30" fill="#047857" rx="14" />
    <rect x="0" y="15" width="345" height="15" fill="#047857" />
    <text x="12" y="20" class="th-text">2. CASHBOX RECONCILIATION</text>

    <text x="12" y="46" class="td-mono" font-weight="700">cash_reconciliations</text>
    <text x="12" y="60" class="td-text">id [PK], semester_id [FK], physical_total, ledger_balance, variance_amount, counted_by [FK], verified_by [FK]</text>
    <line x1="0" y1="68" x2="345" y2="68" stroke="#e2e8f0" />

    <text x="12" y="86" class="td-mono" font-weight="700">denominations <tspan fill="#047857">(3NF Master Lookup)</tspan></text>
    <text x="12" y="100" class="td-text">id [PK], code [UK], label, currency_type, face_value</text>
    <text x="12" y="112" class="td-text" fill="#64748b">11 Philippine units (P1000 down to P0.25 centavos)</text>
    <line x1="0" y1="120" x2="345" y2="120" stroke="#e2e8f0" />

    <text x="12" y="138" class="td-mono" font-weight="700">cash_reconciliation_items <tspan fill="#047857">(3NF Junction)</tspan></text>
    <text x="12" y="152" class="td-text">id [PK], reconciliation_id [FK], denomination_id [FK], quantity, subtotal</text>

    <rect x="0" y="180" width="345" height="55" fill="#ecfdf5" rx="8" />
    <text x="12" y="200" font-family="'Inter', sans-serif" font-size="10.5px" font-weight="700" fill="#047857">TRANSITIVE DEPENDENCY REMOVED:</text>
    <text x="12" y="216" font-family="'Inter', sans-serif" font-size="10px" fill="#065f46">Face value depends on Denominations, NOT the audit session.</text>
  </g>

  <!-- Subsystem 3: Advances Payable & Receivables -->
  <g transform="translate(790, 95)">
    <rect width="350" height="235" class="card-bg" />
    <rect x="0" y="0" width="350" height="30" fill="#0f172a" rx="14" />
    <rect x="0" y="15" width="350" height="15" fill="#0f172a" />
    <text x="12" y="20" class="th-text">3. ADVANCES (ABONO) &amp; RECEIVABLES</text>

    <text x="12" y="46" class="td-mono" font-weight="700">advances_payable <tspan fill="#047857">(Header Claim)</tspan></text>
    <text x="12" y="60" class="td-text">id [PK], claimant_name, total_amount, amount_reimbursed, status</text>
    <line x1="0" y1="68" x2="350" y2="68" stroke="#e2e8f0" />

    <text x="12" y="86" class="td-mono" font-weight="700">advance_disbursements <tspan fill="#047857">(Partial Payout Logs)</tspan></text>
    <text x="12" y="100" class="td-text">id [PK], advance_id [FK], transaction_id [FK], amount, disbursed_by [FK]</text>
    <line x1="0" y1="108" x2="350" y2="108" stroke="#e2e8f0" />

    <text x="12" y="126" class="td-mono" font-weight="700">advance_receipts &amp; debts_receivables</text>
    <text x="12" y="140" class="td-text">Debts split into debts_receivables + debt_payments</text>

    <rect x="0" y="180" width="350" height="55" fill="#f8fafc" rx="8" />
    <text x="12" y="200" font-family="'Inter', sans-serif" font-size="10.5px" font-weight="700" fill="#0f172a">PARTIAL REIMBURSEMENT ARCHITECTURE:</text>
    <text x="12" y="216" font-family="'Inter', sans-serif" font-size="10px" fill="#475569">Officers receive cashbox payouts in stages without modifying claims.</text>
  </g>

  <!-- Subsystems 4 & 5: Auth Governance & Semesters (Bottom Row) -->
  <g transform="translate(60, 350)">
    <rect width="520" height="160" class="card-bg" />
    <rect x="0" y="0" width="520" height="30" fill="#0f172a" rx="14" />
    <rect x="0" y="15" width="520" height="15" fill="#0f172a" />
    <text x="14" y="20" class="th-text">4. AUTHENTICATION &amp; DYNAMIC RBAC (4 TABLES)</text>

    <text x="14" y="52" class="td-mono" font-weight="700">• profiles:</text>
    <text x="95" y="52" class="td-text">id [PK], auth_user_id [UK], full_name, email, role, 8 permission booleans</text>
    <text x="14" y="74" class="td-mono" font-weight="700">• registration_requests:</text>
    <text x="165" y="74" class="td-text">Applicant queue, requested_role, status, reviewed_by [FK]</text>
    <text x="14" y="96" class="td-mono" font-weight="700">• auth_security_state:</text>
    <text x="155" y="96" class="td-text">Lockouts, token expirations, password setup</text>
    <text x="14" y="118" class="td-mono" font-weight="700">• email_verification_otps:</text>
    <text x="175" y="118" class="td-text">6-digit OTP codes, purpose, expiration timestamps</text>

    <rect x="0" y="132" width="520" height="28" fill="#ecfdf5" rx="6" />
    <text x="14" y="149" font-family="'Inter', sans-serif" font-size="10.5px" font-weight="700" fill="#047857">Dynamic RBAC allows Club Advisers to toggle officer capabilities at will.</text>
  </g>

  <g transform="translate(615, 350)">
    <rect width="525" height="160" class="card-bg" />
    <rect x="0" y="0" width="525" height="30" fill="#0f172a" rx="14" />
    <rect x="0" y="15" width="525" height="15" fill="#0f172a" />
    <text x="14" y="20" class="th-text">5. ACADEMIC GOVERNANCE &amp; TELEMETRY (3 TABLES)</text>

    <text x="14" y="52" class="td-mono" font-weight="700">• semesters:</text>
    <text x="95" y="52" class="td-text">id [PK], academic_year, semester, starting_cash_on_hand, is_active</text>
    <text x="14" y="74" class="td-mono" font-weight="700">• semester_signatories:</text>
    <text x="165" y="74" class="td-text">Dynamic wet-ink roster (Dean, Director, Advisers, Officers)</text>
    <text x="14" y="96" class="td-mono" font-weight="700">• audit_logs:</text>
    <text x="95" y="96" class="td-text">Append-only event telemetry (Action, actor user_id, timestamp, previous/new JSON)</text>

    <rect x="0" y="118" width="525" height="42" fill="#f8fafc" rx="6" />
    <text x="14" y="136" font-family="'Inter', sans-serif" font-size="10.5px" font-weight="700" fill="#0f172a">TOTAL SCHEMA FOOTPRINT: 18 TABLES IN PURE 3NF</text>
    <text x="14" y="150" font-family="'Inter', sans-serif" font-size="10px" fill="#64748b">Zero transitive dependencies. Zero update anomalies. 100% referential integrity.</text>
  </g>

  <!-- Bottom Proof Bar -->
  <g transform="translate(60, 525)">
    <rect x="0" y="0" width="1080" height="110" class="callout-bg" />
    <text x="24" y="28" class="callout-title">THE MATHEMATICAL PROOF OF 3NF COMPLIANCE</text>
    <text x="24" y="52" class="callout-text">
      1. <tspan font-weight="700">1NF Satisfied:</tspan> All attributes atomic; zero repeating groups; every entity identified by a unique surrogate UUID primary key.<br>
      2. <tspan font-weight="700">2NF Satisfied:</tspan> All non-key attributes fully depend on their entire primary key; master tables (Profiles, Categories, Semesters) extracted.<br>
      3. <tspan font-weight="700">3NF Satisfied:</tspan> Every non-key attribute depends ONLY on the primary key ($PK \rightarrow Non\text{-}Key$). All transitive dependencies across Denominations, Receipts, Comments, and Advances decomposed into dedicated junction and lookup tables.
    </text>
  </g>
</svg>